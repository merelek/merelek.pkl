<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MaturaLab — Matematyka Maturalna</title>
    <meta
      name="description"
      content="Interaktywna platforma do nauki i rozwiązywania zadań maturalnych z matematyki na poziomie podstawowym z obsługą LaTeX, trybem arkusza i zapisem postępów w przeglądarce."
    />
    <meta property="og:title" content="MaturaLab — Matematyka Maturalna" />
    <meta
      property="og:description"
      content="Interaktywna platforma do nauki i rozwiązywania zadań maturalnych z matematyki na poziomie podstawowym z obsługą LaTeX, trybem arkusza i zapisem postępów w przeglądarce."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('maturalab_theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (!saved && prefersDark)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 antialiased selection:bg-indigo-500/20 selection:text-indigo-700 dark:selection:text-indigo-300">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
